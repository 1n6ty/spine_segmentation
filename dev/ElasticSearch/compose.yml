
volumes:
  es-data:
    external: false
    name: ${PROJECT_NAME}-es-data

networks:
  spine-segmentation-net:
    external: true

services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - node.name=es-node1
      - cluster.name=es-cluster
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - spine-segmentation-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 2m

  es-init:
    image: curlimages/curl:8.11.0
    networks:
      - spine-segmentation-net
    depends_on:
      es:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      curl -s -u elastic:${ELASTIC_PASSWORD} -X PUT http://es:9200/_security/role/django_app_role
      -H 'Content-Type: application/json'
      -d '{\"indices\":[{\"names\":[\"products*\",\"users*\"],\"privileges\":[\"all\"]}]}';

      curl -s -u elastic:${ELASTIC_PASSWORD} -X PUT http://es:9200/_security/user/spine_segmentation_user
      -H 'Content-Type: application/json'
      -d '{\"password\":\"${ELASTIC_PASSWORD}\",\"roles\":[\"django_app_role\"]}';

      echo 'ES app user configured!';
      "