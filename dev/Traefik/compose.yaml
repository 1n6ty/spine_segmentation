networks:
  spine-segmentation-net:
    external: true

configs:
  traefik_static:
    file: ./traefik.yml
  traefik_dynamic:
    file: ./dynamic.yml

services:
  traefik:
    image: traefik:v3.3
    networks:
      - spine-segmentation-net
    configs:
      - source: traefik_static
        target: /etc/traefik/traefik.yml
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      - "${HOST_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:8080/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      nginx:
        condition: service_healthy
    restart: always
