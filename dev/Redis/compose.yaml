networks:
  spine-segmentation-net:
    external: true

configs:
  redis_config:
    name: redis_conf
    file: ./redis.conf

services:
  redis-cache:
    image: redis:8.2.1
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}" --masterauth "${REDIS_PASSWORD}"
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    networks:
      - spine-segmentation-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    configs:
      - source: redis_config
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - cache-data:/data
    restart: always

  redis-session:
    image: redis:8.2.1
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}" --masterauth "${REDIS_PASSWORD}"
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    networks:
      - spine-segmentation-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    configs:
      - source: redis_config
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - session-data:/data
    restart: always

  redis-broker:
    image: redis:8.2.1
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD}" --masterauth "${REDIS_PASSWORD}"
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    networks:
      - spine-segmentation-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    configs:
      - source: redis_config
        target: /usr/local/etc/redis/redis.conf
    volumes:
      - broker-data:/data
    restart: always

volumes:
  cache-data:
    driver: local
    name: ${PROJECT_NAME}-redis-cache
  session-data:
    driver: local
    name: ${PROJECT_NAME}-redis-session
  broker-data:
    driver: local
    name: ${PROJECT_NAME}-redis-broker
