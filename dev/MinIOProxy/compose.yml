networks:
  spine-segmentation-net:
    external: true

configs:
  minio_haproxy_cfg:
    name: ${RESOURCE_PREFIX:-}minio_haproxy_cfg
    file: ./haproxy.cfg

services:
  minio-proxy:
    image: haproxy:3.0-alpine
    networks:
      - spine-segmentation-net
    configs:
      - source: minio_haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9000/haproxy-health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 15s
    depends_on:
      minio-init:
        condition: service_completed_successfully
