global
    log stdout format raw local0
    maxconn 1024

defaults
    mode http
    log global
    option httplog
    timeout connect 300s
    timeout client  60s
    timeout server  60s
    timeout check   2s

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    no log

frontend minio_front
    bind *:9000
    mode http
    # Local-only liveness check, answered directly by HAProxy and never
    # forwarded to minio_back -- this proxy's own health shouldn't depend on
    # MinIO being up; a down backend should fail client requests with a
    # proper 502, not get this proxy killed/restarted in sympathy.
    monitor-uri /haproxy-health
    default_backend minio_back

backend minio_back
    mode http
    option forwardfor
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Proto http
    server minio1 minio:9000 check
