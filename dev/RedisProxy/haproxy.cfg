global
  log stdout format raw local0
  maxconn 1024

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client  30s
  timeout server  30s
  timeout tunnel  1h
  timeout check   2s

listen stats
  bind *:8404
  mode http
  stats enable
  stats uri /
  no log

frontend cache-frontend
  bind *:6379
  default_backend cache-backend

backend cache-backend
  option tcp-check
  tcp-check connect
  tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
  tcp-check expect string +OK
  tcp-check send "info replication\r\n"
  tcp-check expect string role:master
  tcp-check send "QUIT\r\n"
  server redis-cache redis-cache:6379 check inter 1s fall 2 rise 1

