global
  log stdout format raw local0
  maxconn 1024

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  # Redis clients (Django cache/sessions, Celery's broker connection) hold
  # long-lived, often-idle connections (BRPOP, pub/sub) — a short idle
  # timeout here disconnects them mid-wait, causing reconnect loops that
  # never let a queued task actually get consumed.
  timeout client  1h
  timeout server  1h
  timeout check   2s

listen stats
  bind *:8404
  mode http
  stats enable
  stats uri /
  no log

frontend cache-frontend
  bind *:6379
  default_backend cache-backend

backend cache-backend
  option tcp-check
  tcp-check connect
  tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
  tcp-check expect string +OK
  tcp-check send "info replication\r\n"
  tcp-check expect string role:master
  tcp-check send "QUIT\r\n"
  server redis-cache redis-cache:6379 check inter 1s fall 2 rise 1

frontend session-frontend
  bind *:6380
  default_backend session-backend

backend session-backend
  option tcp-check
  tcp-check connect
  tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
  tcp-check expect string +OK
  tcp-check send "info replication\r\n"
  tcp-check expect string role:master
  tcp-check send "QUIT\r\n"
  server redis-session redis-session:6379 check inter 1s fall 2 rise 1

frontend broker-frontend
  bind *:6381
  default_backend broker-backend

backend broker-backend
  option tcp-check
  tcp-check connect
  tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
  tcp-check expect string +OK
  tcp-check send "info replication\r\n"
  tcp-check expect string role:master
  tcp-check send "QUIT\r\n"
  server redis-broker redis-broker:6379 check inter 1s fall 2 rise 1
