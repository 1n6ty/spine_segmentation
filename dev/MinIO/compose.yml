
volumes:
  minio-data1:
    external: false
    name: ${PROJECT_NAME}-minio-data1
  minio-data2:
    external: false
    name: ${PROJECT_NAME}-minio-data2

networks:
  spine-segmentation-net:
    external: true

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    volumes:
      - minio-data1:/data1
      - minio-data2:/data2
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-root}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-rootpassword}
    command: server "http://minio:9000/data{1...2}" --console-address ":9001"
    networks:
      - spine-segmentation-net
  
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    networks:
      - spine-segmentation-net
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 ${MINIO_USER:-root} ${MINIO_PASSWORD:-rootpassword}); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      /usr/bin/mc mb --ignore-existing local/media-public;
      /usr/bin/mc anonymous set download local/media-public;

      /usr/bin/mc mb --ignore-existing local/media-private;
      /usr/bin/mc anonymous set download local/media-private;

      echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::media-public/*\",\"arn:aws:s3:::media-public\",\"arn:aws:s3:::media-private/*\",\"arn:aws:s3:::media-private\"]}]}' > /tmp/spine_segmentation-policy.json;
      /usr/bin/mc admin policy create local spine_segmentation-app-policy /tmp/spine_segmentation-policy.json;

      if /usr/bin/mc admin user info local spine_segmentation_user >/dev/null 2>&1; then
        echo 'MinIO user spine_segmentation_user already exists, leaving credentials untouched';
      else
        /usr/bin/mc admin user add local spine_segmentation_user ${MINIO_PASSWORD:-spine_segmentationminiopass};
        echo 'Created MinIO user spine_segmentation_user';
      fi;
      /usr/bin/mc admin policy attach local spine_segmentation-app-policy --user spine_segmentation_user;

      echo 'All buckets configured safely!';
      "