volumes:
  minio-data1:
    external: false
    name: ${PROJECT_NAME}-minio-data1
  minio-data2:
    external: false
    name: ${PROJECT_NAME}-minio-data2

networks:
  spine-segmentation-net:
    external: true

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    volumes:
      - minio-data1:/data1
      - minio-data2:/data2
    environment:
      - MINIO_ROOT_USER=root
      - MINIO_ROOT_PASSWORD=rootpassword123
    command: server "http://minio:9000/data{1...2}" --console-address ":9001"
    networks:
      - spine-segmentation-net
    restart: always

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    networks:
      - spine-segmentation-net
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 root rootpassword123); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;

      /usr/bin/mc mb --ignore-existing local/media-public;
      /usr/bin/mc policy set download local/media-public;

      /usr/bin/mc mb --ignore-existing local/media-private;

      echo 'All buckets configured safely!';
      "
