global
    log stdout format raw local0
    maxconn 1024

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    timeout tunnel  1h
    timeout check   2s

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    no log

frontend elastic_front
    bind *:9200
    mode http
    default_backend elastic_back

backend elastic_back
    mode http
    balance roundrobin
    server es1 es:9200 check
