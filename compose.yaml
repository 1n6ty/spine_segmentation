volumes:
  media:
    external: false
    name: ${PROJECT_NAME}-media
  static:
    external: false
    name: ${PROJECT_NAME}-static
  mysql-data:
    external: false
    name: ${PROJECT_NAME}-mysql-data
  redis-data:
    external: false
    name: ${PROJECT_NAME}-redis-data

networks:
  spine-segmentation-net:
    external: true


x-django-base: &django-base
  build:
    context: ./backend/Mainland
    args:
      USER_ID: 1000
      GROUP_ID: 1000
  environment:
  # ----------------API-------------------
    - SECRET_KEY=${SECRET_KEY}
    - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
  # ----------------Admin-Panel-----------
    - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
    - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin}
    - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@mail.ru}
  # ---------------Host-------------------
    - DOMAIN=${DOMAIN}
    - HOST_IP=${HOST_IP}
    - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
  #-----------------DataBase--------------
    - MYSQL_HOST=${PROJECT_NAME}-mysql
    - MYSQL_DB_NAME=${MYSQL_DB_NAME}
    - MYSQL_DB_USER=${MYSQL_DB_USER}
    - MYSQL_DB_PASSWORD=${MYSQL_DB_PASSWORD}
  # ----------------Redis-----------------
    - REDIS_HOST=${PROJECT_NAME}-redis
    - REDIS_DB_INDEX=0
  #------------------Celery---------------
    - CELERY_REDIS_INDEX=1
  depends_on:
    redis:
      condition: service_healthy
      restart: true
    mysql:
      condition: service_healthy
      restart: true
  volumes:
    - static:/home/Mainland/static:rw
    - media:/home/Mainland/media:rw
  restart: always


services:
  mysql:
    container_name: ${PROJECT_NAME}-mysql
    build: ./backend/Mysql
    networks:
      spine-segmentation-net:
        aliases:
          - ${PROJECT_NAME}-mysql
    volumes:
      - mysql-data:/var/lib/mysql/:rw
    environment:
    # -----------------DataBase---------------
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DB_NAME=${MYSQL_DB_NAME}
      - MYSQL_DB_USER=${MYSQL_DB_USER}
      - MYSQL_DB_PASSWORD=${MYSQL_DB_PASSWORD}
      - MYSQL_INIT_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  redis:
    container_name: ${PROJECT_NAME}-redis
    image: redis:8.2.1
    networks:
      spine-segmentation-net:
        aliases:
          - ${PROJECT_NAME}-redis
    volumes:
      - redis-data:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: always

  mainland:
    container_name: ${PROJECT_NAME}-mainland
    <<: *django-base
    networks:
      spine-segmentation-net:
        aliases:
          - ${PROJECT_NAME}-mainland
    expose:
      - 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      bash -ec "
      .venv/bin/python3 manage.py crontab remove &&
      .venv/bin/python3 manage.py crontab add &&
      .venv/bin/python3 manage.py migrate &&
      .venv/bin/python3 manage.py run_init &&
      .venv/bin/python3 manage.py create_superuser_if_not_exists &&
      .venv/bin/python3 manage.py collectstatic --no-input &&
      .venv/bin/gunicorn Mainland.asgi:application -k uvicorn_worker.UvicornWorker --workers 1 --timeout 0 -b 0.0.0.0:8080
      "
  
  mainland-celery:
    container_name: ${PROJECT_NAME}-mainland-celery
    <<: *django-base
    networks:
      spine-segmentation-net:
        aliases:
          - ${PROJECT_NAME}-mainland-celery
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/celery -A Mainland inspect ping"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    command: >
      bash -ec "
      .venv/bin/python3 -m celery -A Mainland worker -Q broadcast_ws,broadcast_db,segmentation --loglevel=info
      "

  nginx:
    container_name: ${PROJECT_NAME}-nginx
    build: ./backend/Nginx
    networks:
      spine-segmentation-net:
        aliases:
          - ${PROJECT_NAME}-nginx
    environment:
    # -----------Domains-----------------
      - DOMAIN=${DOMAIN}
    # ----------------API---------------------
      - MAINLAND_HOST=${PROJECT_NAME}-mainland
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mainland:
          condition: service_healthy
          restart: true
    volumes:
      - static:/app/static:ro
      - media:/app/media:ro
    restart: always
