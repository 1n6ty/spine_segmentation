services:
  frontend-builder:
    image: ${REGISTRY_URL}/spine_segmentation-frontend-builder:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        BUILDKIT_INLINE_CACHE: "1"
      cache_from:
        - ${REGISTRY_URL}/spine_segmentation-frontend-builder:${CACHE_TAG:-latest}

  api:
    image: ${REGISTRY_URL}/spine_segmentation-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./backend/Mainland/Dockerfile
      target: production
      args:
        USER_ID: 1000
        GROUP_ID: 1000
        BUILDKIT_INLINE_CACHE: "1"
      additional_contexts:
        - frontend-builder=service:frontend-builder
      cache_from:
        - ${REGISTRY_URL}/spine_segmentation-api:${CACHE_TAG:-latest}

  nginx:
    image: ${REGISTRY_URL}/spine_segmentation-nginx:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./backend/Nginx/Dockerfile
      target: production
      args:
        BUILDKIT_INLINE_CACHE: "1"
      additional_contexts:
        - frontend-builder=service:frontend-builder
      cache_from:
        - ${REGISTRY_URL}/spine_segmentation-nginx:${CACHE_TAG:-latest}
